apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipflop-api
  namespace: flipflop
  labels:
    app: flipflop-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flipflop-api
  template:
    metadata:
      labels:
        app: flipflop-api
    spec:
      containers:
      - name: api
        image: flipflop/api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: API_PORT
          value: "8000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flipflop-secrets
              key: database-url
        - name: AUTHORITY
          value: "ZERO"
        - name: LIVE_ENABLED
          value: "false"
        - name: BROKER_ORDERS_ALLOWED
          value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: databases
          mountPath: /app/databases
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: databases
        persistentVolumeClaim:
          claimName: flipflop-pvc-data
      - name: logs
        persistentVolumeClaim:
          claimName: flipflop-pvc-logs
---
apiVersion: v1
kind: Service
metadata:
  name: flipflop-api
  namespace: flipflop
spec:
  type: ClusterIP
  selector:
    app: flipflop-api
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flipflop-pvc-data
  namespace: flipflop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flipflop-pvc-logs
  namespace: flipflop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flipflop-api-hpa
  namespace: flipflop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flipflop-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
