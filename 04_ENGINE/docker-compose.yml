version: '3.8'

services:
  private-read-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flipflop-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    volumes:
      - ./api.log:/app/api.log
    networks:
      - flipflop-network

networks:
  flipflop-network:
    driver: bridge
